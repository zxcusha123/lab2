name: CMake Build CI


on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.0


      - name: Configure CMake
        run: cmake -B build


      - name: Build project
        run: cmake --build build

      - name: List build directory contents
        if: always()
        run: |
          echo "=== Build directory structure ==="
          find build -type f -o -type d | head -20
          echo ""
          echo "=== Looking for figures ==="
          find build -name "figures" -o -name "*.png" -o -name "*.jpg" -o -name "*.pdf" || echo "No figures found"


      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-output

          path: build/main